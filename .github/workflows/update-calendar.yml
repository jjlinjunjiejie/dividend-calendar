name: Update dividend calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "positions.json"
      - "update_calendar.py"
      - "run_update.py"
      - "data_sources.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: dividend-calendar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Restore last validated source snapshots
        uses: actions/cache/restore@v4
        with:
          path: .cache/dividend-calendar/last-good.json
          key: dividend-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dividend-sources-v1-${{ runner.os }}-

      - name: Fetch dividend data, build calendar, and sync README
        run: python run_update.py

      - name: Save validated source snapshots
        uses: actions/cache/save@v4
        with:
          path: .cache/dividend-calendar/last-good.json
          key: dividend-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-source-status
          path: .cache/dividend-calendar/source-status.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit generated files when data changed
        shell: bash
        run: |
          if git diff --quiet -- dividends.ics README.md; then
            echo "No dividend or position documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.ics README.md
          git commit -m "Update dividend calendar and positions"
          git pull --rebase origin main
          git push origin main
